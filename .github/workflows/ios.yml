name: iOS app

on:
  pull_request:
    branches: [main]
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"

jobs:
  build:
    # Recent XcodeGen emits the Xcode 16 project format (objectVersion 77),
    # which Xcode 15.x on macos-14 cannot open.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        working-directory: ios
        run: xcodegen generate
      - name: Build
        working-directory: ios
        run: >-
          xcodebuild -project Jellyamp.xcodeproj -scheme Jellyamp
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO build
