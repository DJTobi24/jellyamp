name: iOS app

on:
  workflow_dispatch:
  push:
    branches: ["claude/**"]
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
  pull_request:
    branches: [main]
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # macos-26 ships the iOS 26 SDK (Liquid Glass APIs); recent XcodeGen also
    # emits the Xcode 16+ project format that older runners cannot open.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        working-directory: ios
        run: xcodegen generate
      - name: Build
        working-directory: ios
        run: >-
          xcodebuild -project Jellyamp.xcodeproj -scheme Jellyamp
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO build
