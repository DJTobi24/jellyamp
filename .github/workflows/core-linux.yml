name: Swift packages (Linux)

on:
  push:
    branches: ["**"]
    paths:
      - "ios/Packages/**"
      - ".github/workflows/core-linux.yml"
  pull_request:
    paths:
      - "ios/Packages/**"

jobs:
  test:
    runs-on: ubuntu-latest
    container: swift:6.0
    strategy:
      fail-fast: false
      matrix:
        package: [JellyampCore, SonicClient, JellyfinBackend]
    steps:
      - uses: actions/checkout@v4
      - name: Test ${{ matrix.package }}
        working-directory: ios/Packages/${{ matrix.package }}
        run: swift test

  fixtures-in-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sonic API fixtures must match between server and iOS client
        run: bash scripts/sync-fixtures.sh --check
