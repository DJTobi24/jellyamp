name: Jellyamp
# CarPlay switch (default off): `CARPLAY_ENABLED=YES xcodegen generate` merges
# the CarPlay scene manifest + entitlement from project.carplay.yml. Unset,
# the placeholder stays literal and reads as false. See docs/CARPLAY.md.
include:
  - path: project.carplay.yml
    enable: ${CARPLAY_ENABLED}
options:
  bundleIdPrefix: dev.djtobi
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  developmentLanguage: en

configs:
  Debug: debug
  Release: release

# Per-developer values (team ID, optional Last.fm keys) come from the
# untracked Config/Signing.xcconfig, which Jellyamp.xcconfig includes when it
# exists. Nothing account-specific is committed. See docs/RELEASE.md.
configFiles:
  Debug: Config/Jellyamp.xcconfig
  Release: Config/Jellyamp.xcconfig

settingGroups:
  # Single source of truth for the app version. Info.plist reads these via
  # $(MARKETING_VERSION) / $(CURRENT_PROJECT_VERSION); fastlane reads
  # MARKETING_VERSION from here and overrides CURRENT_PROJECT_VERSION on the
  # xcodebuild command line with "latest TestFlight build + 1".
  version:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"

packages:
  JellyampCore:
    path: Packages/JellyampCore
  JellyfinBackend:
    path: Packages/JellyfinBackend
  SonicClient:
    path: Packages/SonicClient
  # The built-in sample library behind demo mode (Support/Demo).
  JellyfinDemo:
    path: Packages/JellyfinDemo

targets:
  Jellyamp:
    type: application
    platform: iOS
    sources:
      - Jellyamp
    dependencies:
      - package: JellyampCore
      - package: JellyfinBackend
      - package: SonicClient
      - package: JellyfinDemo
    info:
      path: Jellyamp/Info.plist
      properties:
        CFBundleDisplayName: Jellyamp
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.music
        # Export compliance: the app only uses encryption that is part of the
        # OS (HTTPS via URLSession, Keychain). Declaring it here skips the
        # per-build question in App Store Connect. See docs/RELEASE.md.
        ITSAppUsesNonExemptEncryption: false
        # Solid near-black launch screen (matches the dark UI, no white flash).
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSupportsIndirectInputEvents: true
        # No UIRequiresFullScreen: the app takes part in iPad multitasking
        # (Split View / Slide Over / windowed mode), which requires all four
        # orientations on iPad.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Music keeps playing with the screen locked / app in the background.
        UIBackgroundModes:
          - audio
        # "Continue this album" in Spotlight / Siri Suggestions
        # (Services/Intents/SystemIntegration.swift).
        NSUserActivityTypes:
          - dev.djtobi.jellyamp.playAlbum
        NSAppTransportSecurity:
          # The server address is typed in by the user and self-hosted
          # Jellyfin servers very often speak plain HTTP on a LAN/VPN under
          # names such as jellyfin.fritz.box, nas.lan or host.tailnet.ts.net.
          # Those are fully qualified, so NSAllowsLocalNetworking (IP
          # literals, .local and unqualified names only) does not cover them,
          # and exception domains cannot be known at build time.
          # Do NOT add NSAllowsLocalNetworking / NSAllowsArbitraryLoadsForMedia
          # / NSAllowsArbitraryLoadsInWebContent next to this key: on iOS 10+
          # their mere presence makes the system ignore NSAllowsArbitraryLoads.
          # App Review justification: docs/RELEASE.md, "App Transport Security".
          NSAllowsArbitraryLoads: true
        # Shown by iOS the first time the app reaches a LAN address. No
        # NSBonjourServices: the app does not browse or advertise Bonjour
        # services; servers are entered by URL.
        NSLocalNetworkUsageDescription: >-
          Jellyamp connects to your Jellyfin server on the local network to
          stream your music.
        # Optional Last.fm application credentials, empty unless set in
        # Config/Signing.xcconfig. Read by the scrobbling settings.
        LastFMAPIKey: $(LASTFM_API_KEY)
        LastFMAPISecret: $(LASTFM_API_SECRET)
    entitlements:
      path: Jellyamp/Jellyamp.entitlements
      properties: {}
        # ---- Opt-in entitlements: add below, replacing the "{}" above ----
        #
        # Siri: NOT needed for App Intents / Shortcuts. Only add it if the app
        # ships a SiriKit Intents extension (INPlayMediaIntent); the App ID
        # then needs the "SiriKit" capability.
        #   com.apple.developer.siri: true
        #
        # CarPlay audio: only after Apple granted the CarPlay Audio App
        # entitlement to the team (docs/CARPLAY.md, docs/RELEASE.md appendix).
        # Adding it earlier makes automatic signing fail.
        #   com.apple.developer.carplay-audio: true
    settings:
      groups:
        - version
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.djtobi.jellyamp
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        ENABLE_USER_SCRIPT_SANDBOXING: true
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # Lets Xcode extract Text("…") / String(localized:) into
        # Resources/Localizable.xcstrings on every build.
        SWIFT_EMIT_LOC_STRINGS: "YES"
        LOCALIZATION_PREFERS_STRING_CATALOGS: "YES"

  JellyampTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - JellyampTests
    dependencies:
      - target: Jellyamp
    settings:
      groups:
        - version
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.djtobi.jellyamp.tests
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: "YES"
        ENABLE_USER_SCRIPT_SANDBOXING: true

  # UI tests and App Store screenshots. They drive the app in demo mode
  # (-JellyampDemo YES), so they need no server. See docs/TESTING.md.
  JellyampUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - JellyampUITests
      # The identifiers the tests look for, shared with the app target: a
      # UI-test bundle runs in its own process and cannot import the app.
      - path: Jellyamp/Support/AccessibilityID.swift
        group: JellyampUITests/Shared
    dependencies:
      - target: Jellyamp
    settings:
      groups:
        - version
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.djtobi.jellyamp.uitests
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: "YES"
        ENABLE_USER_SCRIPT_SANDBOXING: true
        TEST_TARGET_NAME: Jellyamp
        TARGETED_DEVICE_FAMILY: "1,2"

schemes:
  Jellyamp:
    build:
      targets:
        Jellyamp: all
        JellyampTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - JellyampTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  # Separate from the Jellyamp scheme on purpose: UI tests are slow and can
  # flake on a loaded CI simulator, and must not block the unit-test gate.
  # Also the scheme `fastlane screenshots` runs.
  JellyampUITests:
    build:
      targets:
        Jellyamp: all
        JellyampUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - JellyampUITests
